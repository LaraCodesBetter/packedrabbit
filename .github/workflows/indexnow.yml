name: Tell search engines about new pages
# After every deploy, send every URL in the sitemap to IndexNow (Bing and the
# engines that share it, which feed ChatGPT search and Copilot). No secrets:
# the key is public by design and is proved by the key file on the site.
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Cloudflare Pages to publish
        run: sleep 150
      - name: Send the sitemap URLs
        run: |
          KEY=f4fdf52b8d1271d6a90ef6fedd322252
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<\/*loc>//g' | head -10000 | jq -R . | jq -s .)
          echo "Sending $(echo "$URLS" | jq length) URLs"
          jq -n --argjson u "$URLS" --arg k "$KEY" \
            '{host:"packedrabbit.com", key:$k, keyLocation:("https://packedrabbit.com/"+$k+".txt"), urlList:$u}' > body.json
          code=$(curl -s -o resp.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data @body.json)
          echo "IndexNow answered $code"; cat resp.txt
          case "$code" in 200|202) ;; *) exit 1 ;; esac
