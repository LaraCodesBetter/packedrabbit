name: Look at FMCSA's public mover lookup (one time, for the complaints-by-state page)
# Fetches the public Protect Your Move search pages so we can see how they're built.
# Nothing personal: the lookup lists registered interstate movers and complaint counts.
on:
  push:
    branches: [data-fmcsa]
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - name: Read one mover's record
        run: |
          UA="Mozilla/5.0 (compatible; PackedRabbitResearch/1.0; +https://packedrabbit.com/)"
          curl -sSL -A "$UA" --max-time 90 -o one.html "https://ai.fmcsa.dot.gov/hhg/SearchDetails.asp?ads=a&id=30004355&id2=31666141"
          echo "bytes $(wc -c < one.html)"
          python3 - <<'P'
          import re,html
          s=open('one.html',encoding='latin-1').read()
          t=re.sub(r'<script.*?</script>|<style.*?</style>','',s,flags=re.S)
          t=html.unescape(re.sub(r'<[^>]+>','|',t)); t=re.sub(r'[ \t\r\n|]*\|[ \t\r\n|]*','|',t)
          a=t.find('Active Household Goods Authority'); b=t.find('Freedom'); print(t[a:b].replace('|','\n'))
          P
          mkdir -p out; cp one.html out/
      - uses: actions/upload-artifact@v4
        with: { name: fmcsa-look, path: out }
