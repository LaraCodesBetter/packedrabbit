name: Look at FMCSA's public mover lookup (one time, for the complaints-by-state page)
# Fetches the public Protect Your Move search pages so we can see how they're built.
# Nothing personal: the lookup lists registered interstate movers and complaint counts.
on:
  push:
    branches: [data-fmcsa]
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the search pages
        run: |
          mkdir out; cd out
          UA="Mozilla/5.0 (compatible; PackedRabbitResearch/1.0; +https://packedrabbit.com/)"
          get() { curl -sSL -A "$UA" --max-time 60 -o "$1" "$2"; echo "$1 $(wc -c < "$1")"; sleep 2; }
          get search.html "https://ai.fmcsa.dot.gov/hhg/Search.asp"
          get state.html "https://ai.fmcsa.dot.gov/hhg/Search.asp?ads=a"
          get cats.html "https://ai.fmcsa.dot.gov/hhg/complaint_category.asp"
          grep -oiE '<form[^>]*>|<(input|select)[^>]*name="[^"]*"[^>]*>' state.html search.html | head -40 > forms.txt || true
          cat forms.txt
      - uses: actions/upload-artifact@v4
        with: { name: fmcsa-look, path: out }
