<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hub</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hub">
<meta name="theme-color" content="#04340e">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Same identity as packedrabbit.com: the green family, kraft tape, rounded display type. */
:root{--g:#23673C;--g2:#1C3224;--cream:#F3FAF6;--tape:#EADFC9;--tape-ink:#14281B;--kraft:#D9E3DA;--ink:#14281B;--ink2:#415B4B;--line:rgba(20,40,27,.13);--card:#fff;--warn:#C8102E;
 --display:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;--lift:0 1px 2px rgba(15,27,45,.06),0 4px 14px rgba(15,27,45,.06)}
@media (prefers-color-scheme:dark){:root{--cream:#0D1410;--card:#112016;--ink:#E0F2E7;--ink2:#B5D5C1;--line:rgba(224,242,231,.2);--g:#5BD086;--g2:#E0F2E7;--warn:#FF5C76;--lift:inset 0 1px 0 rgba(255,255,255,.06)}}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.5 -apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:var(--cream);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 0}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}.brand img.wm{height:30px;width:auto}.brand .hubtag{font:700 13px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;background:var(--tape);color:var(--tape-ink);padding:6px 10px;border-radius:6px;transform:rotate(-2deg)}
.wm-dark{display:none}@media (prefers-color-scheme:dark){.wm-light{display:none}.wm-dark{display:inline}}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav button{flex:none;min-height:44px;padding:0 13px;border:0;background:none;font:600 16px var(--display);color:var(--ink2);border-bottom:3px solid transparent;cursor:pointer}
nav button[aria-selected=true]{color:var(--g);border-bottom-color:var(--g)}
nav .dot{display:inline-block;min-width:20px;padding:1px 6px;margin-left:5px;border-radius:99px;background:var(--g);color:var(--cream);font-size:12px;line-height:18px;text-align:center}
main{padding:14px 16px 80px;max-width:980px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--lift)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px;width:100%}
textarea{min-height:120px}
label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:10px 0 4px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--g);background:none;color:var(--g);font:700 16px var(--display);cursor:pointer}
.btn.p{background:var(--g);color:var(--cream)}.btn.s{min-height:36px;padding:0 10px;font-size:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--lift)}.stat b{display:block;font:700 26px var(--display)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:center;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer;min-height:56px}
.list li:first-child{border-top:0}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--g) 14%,transparent);color:var(--g);white-space:nowrap}
.tag.w{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}.tag.k{background:var(--tape);color:var(--tape-ink)}
.grow{flex:1;min-width:0}.muted{color:var(--ink2);font-size:14px}
.ev{border-left:3px solid var(--g);padding:6px 10px;margin:8px 0}.ev .muted{font-size:13px}
.star{min-width:44px;min-height:44px;border:0;background:none;font-size:22px;color:var(--g);cursor:pointer;padding:0}
.cfbox{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:8px 12px}.cfbox summary{cursor:pointer;min-height:32px}
.mfold{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.mfold .btn{flex:0 0 auto}
.tmsgs{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}.tmsg{padding:8px 10px;border-radius:12px;background:color-mix(in srgb,var(--g) 6%,transparent);margin-bottom:8px}.tmsg.ai{background:color-mix(in srgb,var(--g) 14%,transparent)}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.note{background:var(--tape);color:var(--tape-ink);border-radius:12px;padding:12px;font-size:15px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:12px 16px;border-radius:12px;display:none;z-index:9;max-width:92vw}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
a{color:var(--g);text-underline-offset:3px}
.gate{max-width:420px;margin:40px auto;text-align:center}.gate img{width:120px;height:120px;border-radius:28px}
.sec{font:700 20px var(--display);margin:18px 2px 8px}
.task{display:block}.task h3{margin:0 0 4px;font-size:18px}.task ol{margin:8px 0 4px;padding-left:22px}.task ol li{margin:4px 0}
.task details summary{min-height:40px;display:flex;align-items:center;cursor:pointer;font-weight:700;color:var(--g)}
.sheet{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch}
.sheet table{border-collapse:separate;border-spacing:0;font-size:14px;min-width:1100px;width:100%}
.sheet th,.sheet td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.sheet thead th{position:sticky;top:0;z-index:2;background:var(--card);font-weight:700;color:var(--ink2);cursor:pointer;user-select:none}
.sheet thead th[aria-sort]{color:var(--g)}
.sheet td:first-child,.sheet th:first-child{position:sticky;left:0;background:var(--card);z-index:1;max-width:180px;border-right:1px solid var(--line)}
.sheet thead th:first-child{z-index:3}
.sheet tbody tr{cursor:pointer}.sheet tbody tr:hover td{background:color-mix(in srgb,var(--g) 8%,var(--card))}
.sheet .muted{font-size:13px}
.pcard.just{outline:3px solid var(--g);outline-offset:2px}
.lanes{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.lane{flex:0 0 min(300px,84vw);scroll-snap-align:start;background:color-mix(in srgb,var(--tape) 45%,var(--cream));border:1px solid var(--line);border-radius:16px;padding:10px}
.lane h3{margin:2px 4px 8px;font-size:16px;display:flex;justify-content:space-between}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--lift);cursor:pointer}
.pcard h4{margin:0 0 4px;font:700 16px/1.3 var(--display)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--g)}
.steprow{display:flex;gap:8px;align-items:center;min-height:44px}.steprow input[type=checkbox]{width:22px;height:22px;min-height:0;flex:none}
.logitem{border-left:4px solid var(--g);padding:8px 12px;margin:10px 0}.logitem h3{margin:2px 0 4px;font-size:17px}
</style>
<style id="skipcss">.skip{position:absolute;left:-9999px;top:8px;z-index:9999;background:#14281B;color:#fff;padding:12px 18px;border-radius:10px;font-weight:700;text-decoration:none}.skip:focus{left:8px}</style>
</head>
<body>
<a class="skip" href="#main">Skip to the content</a>
<header>
  <div class="brand"><img class="wm wm-light" src="../img/wordmark.png" alt="The Packed Rabbit"><img class="wm wm-dark" src="../img/wordmark-cream.png" alt="The Packed Rabbit"><span class="hubtag">Hub</span></div>
  <nav role="tablist" id="tabs"></nav>
</header>
<main id="main"><p class="muted">Opening the back office...</p></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const TABS=[["tasks","Tasks"],["email","Mail"],["projects","Projects"],["prospects","Prospects"],["clients","Clients and testers"],["products","Products"],["campaigns","Campaigns"],["kb","Knowledge base"],["social","Social"],["activity","Activity"],["log","Maintenance log"],["team","Team"]];
const CLIENT=c=>c.status==="beta"||c.status==="customer"||c.cls==="TEST"||c.cls==="BUY";
const KB=[["Every moving question, one box","/tools/"],["What I wish I'd known (all answers)","/answers/"],["Moving to a new state or abroad","/moving-to/"],["Is my moving quote a scam? Quote checker","/quote-check/"],["Check a mover before you pay","/mover-check/"],["Will my couch fit through the door?","/fit/"],["What size truck do I need?","/truck/"],["How many boxes do I need?","/boxes/"],["Moving checklist by date","/checklist/"],["How long will moving day take?","/move-day/"],["Security deposit deadline by state","/deposit/"],["Move-out checklist","/move-out/"],["Damage or loss claim letter","/claim/"],["Moving company or broker?","/movers-vs-brokers/"],["New state license and registration","/new-state/"],["Moving with a dog or cat","/moving-pets/"],["First-night box","/first-night/"],["Crew: where everything went","/crew/"],["Join the beta","/beta/"],["For business","/business/"],["The app","/app/"]];
const SITE="https://packedrabbit.com";
const CLASSES={PM:"Property management",LEA:"Leasing agent or office",AGT:"Realtor (agent or team)",BRK:"Real estate brokerage",BRL:"Brokerage relocation",SMM:"Senior move manager",SLS:"Senior living specialist",ORG:"Professional organizer",RMC:"Corporate relocation",STO:"Self-storage",CLN:"Move-out cleaning",MOV:"Moving company",PRESS:"Press or creator",TEST:"Beta tester",BUY:"Customer",OTH:"Other"};
const SOURCES=["Research (Lumi)","Research (Claude)","Website sign-up","Referral","Zillow","Facebook","Instagram","TikTok","Google","Nextdoor","Event","Other"];
const STATUS=["new","hold - reverify","contacted","replied","beta","customer","declined","do not contact"];
const NOSEND=s=>s==="declined"||s==="do not contact"||s==="hold - reverify";
const EVTYPES=[["outreach","Email we sent"],["inbound","Email they sent"],["reply","Reply"],["beta","Joined the beta"],["purchase","Purchase"],["open","Opened our email"],["call","Call or meeting"],["note","Note"]];
const PLATFORMS=[["instagram","Instagram","https://www.instagram.com/thepackedrabbit/"],["tiktok","TikTok","https://www.tiktok.com/@thepackedrabbit"],["youtube","YouTube","https://www.youtube.com/@thepackedrabbit"],["reddit","Reddit","https://www.reddit.com/user/PackedRabbitApp/"],["facebook","Facebook",""],["pinterest","Pinterest",""]];
const S={projects:[],pDept:"",pOwner:"",pShowDone:false,editProj:null,me:null,users:[],newCode:null,sortK:"last",sortD:-1,view:"sheet",fsrc:"",tab:"tasks",tasks:[],log:[],activity:[],actFilter:"",newTask:null,showDone:false,products:[],contacts:[],campaigns:[],social:{},posts:[],sel:null,events:[],q:"",fc:"",fs:"",fst:"",editCamp:null,editProd:null,ready:false,in:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",3500)};
const fmt=t=>t?new Date(t).toLocaleString("en-US",{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"}):"";
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- storage on packedrabbit.com ---------- */
class SignedOut extends Error{}
async function api(route,body){
  const r=await fetch("/api/hub/"+route,body?{method:"POST",headers:{"content-type":"application/json","x-hub":"1"},body:JSON.stringify(body),credentials:"same-origin"}:{credentials:"same-origin",cache:"no-store"});
  if(r.status===401&&route!=="login"){S.in=false;gate();throw new SignedOut();}
  let j={};try{j=await r.json();}catch(e){}
  if(!r.ok){const e=new Error(j.error||("HTTP "+r.status));e.code=j.error;throw e;}
  return j;
}
const list=async coll=>(await api("list?coll="+encodeURIComponent(coll))).docs;
async function put(path,data){ try{ await api("set",{path,data}); await refresh(path); return true; }catch(e){ if(!(e instanceof SignedOut)) toast("Couldn't save. Check your connection and try again."); return false; } }
async function merge(path,data){ await api("merge",{path,data}); await refresh(path); }
async function refresh(path){ const c=path.split("/")[0]; if(path.split("/").length>2) return; await loadColl(c); }
async function loadColl(c){
  const L=await list(c);
  if(c==="contacts"){ const fresh=S.contacts.filter(x=>x.fresh&&!L.some(y=>y.id===x.id)); S.contacts=[...L,...fresh]; }
  else if(c==="social"){ S.social={}; L.forEach(x=>S.social[x.id]=x); }
  else S[c]=L;
}
async function loadTeam(){ try{ const [m,u]=await Promise.all([api("me"),api("users")]); S.me=m.user||null; S.users=u.users||[]; }catch(e){ if(e instanceof SignedOut) throw e; } }
async function loadAll(){ await Promise.all([...["contacts","campaigns","social","posts","products","tasks","log","projects","mail","mailtpl","mailrules"].map(loadColl),loadTeam()]); S.ready=true; }
async function loadEvents(cid){ const L=await list("contacts/"+cid+"/events"); if(S.sel!==cid) return; S.events=L.sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,200); render(); }

/* ---------- sign-in ---------- */
function gate(msg){ $("#tabs").innerHTML=""; $("#main").innerHTML=`<div class="gate card"><img src="icon-512.png" alt=""><h2 style="margin:12px 0 6px">The Packed Rabbit hub</h2><p class="muted" style="margin:0 0 14px">Enter your owner code once. This browser then stays signed in.</p>
  <form id="gf"><label for="code" style="text-align:left">Owner code</label><input id="code" autocomplete="current-password" autocapitalize="off" spellcheck="false" placeholder="xxxx-xxxx-xxxx-xxxx-xxxx-xxxx" required>
  <button class="btn p" style="width:100%;margin-top:12px">Open the hub</button></form><p id="gmsg" class="muted" role="alert" style="min-height:1.4em;margin:10px 0 0">${esc(msg||"")}</p></div>`;
  $("#gf").onsubmit=async e=>{ e.preventDefault(); const code=$("#code").value.trim(); $("#gmsg").textContent="Checking...";
    try{ await api("login",{code}); }catch(err){ $("#gmsg").textContent=err.code==="too_many_tries"?"Too many tries. Wait 15 minutes, then try again.":err.code==="wrong_code"?"That code didn't match. Check it and try again.":"Couldn't reach the hub. Check your connection."; return; }
    await start(code); };
}
async function seedIfNeeded(code){
  const me=await api("me"); if(me.seeded) return;
  $("#main").innerHTML='<div class="card"><p>First time here: bringing your contacts over from the old hub...</p></div>';
  const norm=String(code).toLowerCase().replace(/[^a-z0-9]/g,"");
  const buf=new Uint8Array(await (await fetch("seed.bin",{cache:"no-store"})).arrayBuffer());
  const key=await crypto.subtle.importKey("raw",await crypto.subtle.digest("SHA-256",new TextEncoder().encode("seed:"+norm)),"AES-GCM",false,["decrypt"]);
  const docs=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:buf.slice(0,12)},key,buf.slice(12))));
  for(let i=0;i<docs.length;i+=150) await api("bulk",{docs:docs.slice(i,i+150)});
  await api("set",{path:"meta/seeded",data:{at:Date.now(),count:docs.length}});
}
async function start(code){
  S.in=true;
  try{ if(code) await seedIfNeeded(code); await loadAll(); }catch(e){ if(e instanceof SignedOut) return; $("#main").innerHTML='<div class="card"><p>The hub couldn\'t load its data. Check your connection, then reload this page.</p></div>'; return; }
  render();
}

function tabs(){ const mine=S.tasks.filter(t=>t.owner==="lara"&&t.status!=="done").length; $("#tabs").innerHTML=TABS.map(([k,n])=>`<button role="tab" aria-selected="${S.tab===k}" data-tab="${k}">${n}${k==="tasks"&&mine?`<span class="dot" aria-label="${mine} for you">${mine}</span>`:""}</button>`).join(""); document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;S.sel=null;S.editCamp=null;S.editProj=null;S.editProd=null;S.tEdit=null;render(); if(S.tab==="activity") loadColl("activity").then(render).catch(()=>{}); if(S.tab==="email"){ S.mopen=null; S.compose=null; mailSync(); } }); }

function render(){ if(!S.in) return; tabs(); const m=$("#main");
  m.innerHTML=({prospects:S.sel?contactView:contactsView,clients:S.sel?contactView:contactsView,products:productsView,kb:kbView,campaigns:campaignsView,social:socialView,email:emailView,tasks:S.tEdit?tEditView:tasksView,projects:S.editProj?projEdit:projectsView,log:logView,activity:activityView,team:teamView})[S.tab]();
  wire(); }


/* ---------- projects board ---------- */
const PCOLS=[["idea","Ideas"],["todo","To do"],["doing","In progress"],["waiting","Waiting"],["done","Done"]];
const DEPTS={ceo:"CEO",cfo:"CFO",marketing:"Marketing and sales",service:"Customer service",legal:"Legal",tech:"Programming and implementation"};
function ON(){ return ((S.users||[]).find(u=>u.id==="owner")||{}).name||"Owner"; }
const owners=()=>[...new Set([ON(),"Claude","Hub manager",...S.users.filter(u=>u.kind!=="ai").map(u=>u.name)])];
const pSteps=p=>Array.isArray(p.steps)?p.steps:[];
function projCard(p){ const st=pSteps(p), d=st.filter(x=>x.done).length, i=PCOLS.findIndex(c=>c[0]===p.status);
  return `<div class="pcard" data-proj="${esc(p.id)}"><h4>${esc(p.title)}</h4><div class="row" style="gap:6px">${p.dept?`<span class="tag">${esc(DEPTS[p.dept]||p.dept)}</span>`:""}${p.owner?`<span class="tag k">${esc(p.owner)}</span>`:""}</div>
  ${p.due?`<div class="muted" style="margin-top:4px">Due ${esc(dayOf(p.due+"T12:00:00"))}</div>`:""}${st.length?`<div class="bar" aria-hidden="true"><i style="width:${Math.round(d/st.length*100)}%"></i></div><div class="muted">${d} of ${st.length} steps done</div>`:""}
  <div class="row" style="margin-top:6px;justify-content:space-between">${i>0?`<button class="btn s" data-pmove="${esc(p.id)}" data-dir="-1" aria-label="Move back to ${esc(PCOLS[i-1][1])}">← ${esc(PCOLS[i-1][1])}</button>`:"<span></span>"}${i<PCOLS.length-1?`<button class="btn s" data-pmove="${esc(p.id)}" data-dir="1" aria-label="Move on to ${esc(PCOLS[i+1][1])}">${esc(PCOLS[i+1][1])} →</button>`:""}</div></div>`; }
function projectsView(){ const P=S.projects.filter(p=>p.status!=="archived"&&(!S.pjDept||p.dept===S.pjDept)&&(!S.pjOwner||p.owner===S.pjOwner)).sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999")||(a.created||0)-(b.created||0));
  const cols=PCOLS.filter(c=>c[0]!=="done"||S.pShowDone);
  return `<div class="card"><p style="margin:0 0 10px"><b>${P.filter(p=>p.status==="doing").length}</b> in progress · <b>${P.filter(p=>p.status==="todo").length}</b> to do · <b>${P.filter(p=>p.status==="waiting").length}</b> waiting</p><div class="two"><select id="pjDept" aria-label="Department"><option value="">Every department</option>${Object.entries(DEPTS).map(([k,v])=>`<option value="${k}" ${S.pjDept===k?"selected":""}>${v}</option>`).join("")}</select><select id="pjOwner" aria-label="Owner"><option value="">Everyone</option>${owners().map(o=>`<option ${S.pjOwner===o?"selected":""}>${esc(o)}</option>`).join("")}</select></div>
  <div class="row" style="margin-top:10px"><button class="btn p" id="pjNew">Add a project</button><button class="btn" id="pjDoneT">${S.pShowDone?"Hide":"Show"} done (${P.filter(p=>p.status==="done").length})</button></div><p class="muted" style="margin:8px 0 6px">Tap a column to jump to it, or swipe sideways. Tap a project to open it.</p><div class="row" role="group" aria-label="Jump to a column" style="gap:6px;flex-wrap:wrap">${cols.map(([k,n])=>`<button class="btn s" data-pcol="${esc(n)}" style="min-height:44px">${esc(n)} <b>${P.filter(p=>p.status===k).length}</b></button>`).join("")}</div></div>
  <div class="lanes">${cols.map(([k,n])=>{ const L=P.filter(p=>p.status===k); return `<section class="lane" aria-label="${n}"><h3>${n}<span class="muted">${L.length}</span></h3>${L.map(projCard).join("")||'<p class="muted" style="margin:4px">Nothing here.</p>'}</section>`; }).join("")}</div>`; }
function projEdit(){ const p=S.editProj, st=pSteps(p);
  return `<button class="btn s" id="pjBack">← Projects</button><div class="card" style="margin-top:10px">
  <label for="pj_title">Project</label><input id="pj_title" value="${esc(p.title||"")}">
  <div class="two"><div><label for="pj_dept">Department</label><select id="pj_dept"><option value="">None</option>${Object.entries(DEPTS).map(([k,v])=>`<option value="${k}" ${p.dept===k?"selected":""}>${v}</option>`).join("")}</select></div><div><label for="pj_owner">Owner</label><select id="pj_owner">${owners().map(o=>`<option ${p.owner===o?"selected":""}>${esc(o)}</option>`).join("")}</select></div></div>
  <div class="two"><div><label for="pj_status">Column</label><select id="pj_status">${PCOLS.map(([k,n])=>`<option value="${k}" ${p.status===k?"selected":""}>${n}</option>`).join("")}</select></div><div><label for="pj_due">Due</label><input id="pj_due" type="date" value="${esc(p.due||"")}"></div></div>

    try{ await merge("tasks/"+t.id,{title,owner:$("#te_owner").value,status:$("#te_status").value,due:$("#te_due").value,steps:$("#te_steps").value.trim(),link:$("#te_link").value.trim(),editedBy:(S.me&&S.me.name)||ON(),edited:Date.now()}); S.tEdit=null; toast("Saved"); render(); }catch(e){ if(!(e instanceof SignedOut)) toast("Couldn't save. Try again."); } });
  document.querySelectorAll("[data-treopen]").forEach(b=>b.onclick=async()=>{ await merge("tasks/"+b.dataset.treopen,{status:"open"}).catch(()=>toast("Couldn't save. Try again.")); render(); });
  on("#q","oninput",e=>{S.q=e.target.value;const p=e.target.selectionStart;render();const q=$("#q");q.focus();q.setSelectionRange(p,p);});
  ["fc","fs","fst","fsrc"].forEach(k=>on("#"+k,"onchange",e=>{S[k]=e.target.value;render();}));
  on("#sortK","onchange",e=>{S.sortK=e.target.value;S.sortD=DATEK.has(S.sortK)?-1:1;render();});
  on("#sortD","onclick",()=>{S.sortD=-S.sortD;render();});
  on("#viewT","onclick",()=>{S.view=S.view==="sheet"?"cards":"sheet";render();});
  document.querySelectorAll("[data-sort]").forEach(th=>th.onclick=()=>{const k=th.dataset.sort; if(S.sortK===k) S.sortD=-S.sortD; else {S.sortK=k;S.sortD=DATEK.has(k)?-1:1;} render();});
  document.querySelectorAll("[data-c]").forEach(li=>li.onclick=()=>openContact(li.dataset.c));
  on("#addC","onclick",()=>openContact(id(),true,S.tab==="clients"));
  on("#imp","onclick",()=>{$("#impBox").hidden=!$("#impBox").hidden;});
  on("#csvf","onchange",async e=>{const f=e.target.files[0]; if(f) $("#csv").value=await f.text();});
  on("#doImp","onclick",()=>importCsv($("#csv").value));
  on("#exp","onclick",exportCsv);
  on("#nuAdd","onclick",async()=>{ const name=$("#nu_name").value.trim(); if(!name){toast("Add their name");return;} try{ const r=await api("users/add",{name,email:$("#nu_email").value.trim(),role:$("#nu_role").value}); S.newCode={name,code:r.code}; await loadTeam(); render(); }catch(e){ if(!(e instanceof SignedOut)) toast("Couldn't add them. Try again."); } });
  on("#codeDone","onclick",()=>{S.newCode=null;render();});
  document.querySelectorAll("[data-urole]").forEach(el=>el.onchange=async()=>{ try{ await api("users/role",{id:el.dataset.urole,role:el.value}); await loadTeam(); toast("Role changed"); render(); }catch(e){ if(!(e instanceof SignedOut)) toast("Couldn't change the role."); } });
  document.querySelectorAll("[data-unew]").forEach(b=>b.onclick=async()=>{ const u=S.users.find(x=>x.id===b.dataset.unew); if(!confirm("Make a new code for "+(u?u.name:"them")+"? Their old code stops working and they're signed out.")) return; try{ const r=await api("users/newcode",{id:u.id}); S.newCode={name:u.name,code:r.code}; await loadTeam(); render(); }catch(e){ if(!(e instanceof SignedOut)) toast("Couldn't make a new code."); } });
  document.querySelectorAll("[data-urm]").forEach(b=>b.onclick=async()=>{ const u=S.users.find(x=>x.id===b.dataset.urm); if(!confirm("Remove "+(u?u.name:"them")+" from the hub? They're signed out right away.")) return; try{ await api("users/remove",{id:u.id}); await loadTeam(); toast("Removed"); render(); }catch(e){ if(!(e instanceof SignedOut)) toast("Couldn't remove them."); } });
  on("#out","onclick",async e=>{e.preventDefault(); try{await api("logout",{});}catch(x){} S.in=false; gate("Signed out of this browser.");});
  on("#back","onclick",()=>{S.sel=null;render();});
  on("#saveC","onclick",saveContact);
  on("#addEv","onclick",addEvent);
  on("#pNew","onclick",()=>{S.editProd={id:id(),name:"",price:"",kind:"Membership",where:"",status:"Live",link:"",desc:""};render();});
  document.querySelectorAll("[data-prod]").forEach(li=>li.onclick=()=>{S.editProd={...S.products.find(p=>p.id===li.dataset.prod)};render();});
  on("#pBack","onclick",()=>{S.editProd=null;render();});
  on("#pSave","onclick",async()=>{const e=S.editProd; ["name","price","kind","where","status","link","desc"].forEach(k=>e[k]=$("#p_"+k).value.trim()); if(!e.name){toast("Give it a name");return;} const {id:pid,...b}=e; if(await put("products/"+pid,{...b,updated:Date.now()})){toast("Saved");S.editProd=null;render();}});
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{ try{ await navigator.clipboard.writeText(b.dataset.copy); toast("Copied"); }catch(e){ toast(b.dataset.copy); } });
  on("#cNew","onclick",()=>{S.editCamp={id:id(),name:"",cls:"",state:"",status:"",subject:"",body:"Hello {name},\n\n",stage:"draft",created:Date.now()};render();});
  document.querySelectorAll("[data-camp]").forEach(li=>li.onclick=()=>{S.editCamp={...S.campaigns.find(c=>c.id===li.dataset.camp)};render();});
  on("#cBack","onclick",()=>{S.editCamp=null;render();});
  ["c_cls","c_state","c_status"].forEach(k=>on("#"+k,"onchange",()=>{readCamp();render();}));
  on("#cSave","onclick",()=>saveCamp("draft"));
  on("#cAsk","onclick",()=>saveCamp("ready, awaiting your yes"));
  document.querySelectorAll("[data-ssave]").forEach(b=>b.onclick=async()=>{const k=b.dataset.ssave; if(await put("social/"+k,{url:$(`[data-surl="${k}"]`).value.trim(),followers:+$(`[data-sfol="${k}"]`).value||0,updated:Date.now()})){toast("Saved");render();}});
  document.querySelectorAll("[data-padd]").forEach(b=>b.onclick=async()=>{const k=b.dataset.padd,u=$(`[data-purl="${k}"]`).value.trim(); if(!u){toast("Add the post's link first");return;} if(await put("posts/"+id(),{platform:k,url:u,title:$(`[data-ptitle="${k}"]`).value.trim(),views:+$(`[data-pviews="${k}"]`).value||0,at:Date.now()})){toast("Post logged");render();}});
}

function openContact(cid,isNew,client){ if(S.tab!=="prospects"&&S.tab!=="clients"){ const c=S.contacts.find(x=>x.id===cid); S.tab=c&&CLIENT(c)?"clients":"prospects"; } S.sel=cid; S.events=[]; if(isNew) S.contacts.push({id:cid,status:client?"beta":"new",cls:client?"TEST":"OTH",fresh:1});
  render(); if(!isNew){ loadEvents(cid).catch(()=>{}); loadColl("activity").then(()=>{ if(S.sel===cid) render(); }).catch(()=>{}); } }
async function saveContact(){ const c={...(S.contacts.find(x=>x.id===S.sel)||{})}; delete c.fresh;
  ["company","name","role","email","phone","website","city","state","zip","source","notes"].forEach(k=>c[k]=$("#f_"+k).value.trim()); c.cls=$("#f_cls").value; c.status=$("#f_status").value; c.leadSource=$("#f_leadSource").value; c.offers=$("#f_offers").value; if(c.offers&&!c.offersAt) c.offersAt=Date.now(); c.state=(c.state||"").toUpperCase(); c.updated=Date.now(); c.email=c.email.toLowerCase(); if(!c.created) c.created=Date.now();
  const {id:cid,...body}=c; if(await put("contacts/"+S.sel,body)){ toast("Saved"); render(); } }
async function addEvent(){ const t=$("#evT").value,s=$("#evS").value.trim(),n=$("#evN").value.trim(); if(!s&&!n){toast("Add a line about what happened");return;}
  const cid=S.sel; if(await put("contacts/"+cid+"/events/"+id(),{type:t,subject:s,body:n,at:Date.now()})){ const c=S.contacts.find(x=>x.id===cid); if(c&&!c.fresh){ try{ await merge("contacts/"+cid,{last:Date.now(),...(t==="outreach"&&c.status==="new"?{status:"contacted"}:{}),...(t==="outreach"&&!c.firstSent?{firstSent:Date.now()}:{}),...(t==="reply"||t==="inbound"?{status:c.status==="new"||c.status==="contacted"?"replied":c.status}:{})}); }catch(e){} } toast("Added"); loadEvents(cid).catch(()=>{}); } }

function readCamp(){ const e=S.editCamp; if(!e) return; e.name=$("#c_name").value; e.cls=$("#c_cls").value; e.state=$("#c_state").value.trim().toUpperCase(); e.status=$("#c_status").value; e.subject=$("#c_subj").value; e.body=$("#c_body").value; }
async function saveCamp(stage){ readCamp(); const e=S.editCamp; if(!e.name.trim()){toast("Give the campaign a name");return;} e.stage=stage; e.audience=audience(e).length; const {id:cid,...body}=e; if(await put("campaigns/"+cid,body)){ toast(stage==="draft"?"Draft saved":"Marked ready. Nothing is sent until you approve it."); S.editCamp=null; render(); } }

function parseCsv(t){ const rows=[];let r=[],v="",q=false; for(let i=0;i<t.length;i++){const ch=t[i]; if(q){ if(ch==='"'&&t[i+1]==='"'){v+='"';i++;} else if(ch==='"') q=false; else v+=ch; } else if(ch==='"') q=true; else if(ch===","){r.push(v);v="";} else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&t[i+1]==="\n") i++; r.push(v);v=""; if(r.some(x=>x.trim())) rows.push(r); r=[]; } else v+=ch; } r.push(v); if(r.some(x=>x.trim())) rows.push(r); return rows; }
async function importCsv(t){ const R=parseCsv((t||"").replace(/^﻿/,"")); if(R.length<2){ toast("Paste a list with a header row");return;}
  const H=R[0].map(h=>h.trim().toLowerCase()); const col=(...n)=>H.findIndex(h=>n.includes(h));
  const ix={cid:col("contact id","id"),company:col("company","business","organization"),name:col("contact name","name","contact","person"),role:col("job title","role","title"),routing:col("contact routing"),email:col("email","e-mail"),phone:col("phone"),website:col("website","url","site"),city:col("city"),state:col("state","st"),zip:col("zip","zip code","postal"),cls:col("class","class code","type"),source:col("source url","source"),notes:col("notes"),status:col("status","lead status"),lsrc:col("lead source"),owner:col("contact owner"),track:col("track"),intro:col("intro moment","intro"),open:col("personalized opening"),subj:col("email subject"),draft:col("email draft")};
  toast("Importing..."); let add=0,upd=0;
  for(const r of R.slice(1)){ const g=k=>ix[k]>=0?String(r[ix[k]]||"").trim():""; const email=g("email").toLowerCase(); if(!email&&!g("company")) continue;
    const want=g("cid").replace(/[^A-Za-z0-9_-]/g,""); const ex=(email&&S.contacts.find(c=>c.email===email))||(want&&S.contacts.find(c=>c.id===want));
    const body={company:g("company"),name:g("name"),role:g("role")||g("routing"),email,phone:/999-9999/.test(g("phone"))?"":g("phone"),website:g("website"),city:g("city"),state:g("state").toUpperCase(),zip:g("zip"),cls:(CLASSES[g("cls").toUpperCase()]?g("cls").toUpperCase():"OTH"),source:g("source"),leadSource:g("lsrc")||(/lumi/i.test(g("owner"))?"Research (Lumi)":""),notes:[want,g("open")&&"Opening line: "+g("open"),g("track")&&"Track: "+g("track"),g("intro")&&"Intro moment: "+g("intro"),g("notes")].filter(Boolean).join(" · "),updated:Date.now()};
    if(ex){ const m={}; Object.entries(body).forEach(([k,v])=>{if(v&&k!=="cls"&&k!=="notes")m[k]=v;}); try{ await api("merge",{path:"contacts/"+ex.id,data:m}); upd++; }catch(e){} }
    else { const st=/^hold/i.test(g("status"))?"hold - reverify":STATUS.includes(g("status"))?g("status"):"new", cid=want||id();
      try{ await api("set",{path:"contacts/"+cid,data:{...body,status:st,created:Date.now()}}); add++;
        if(g("draft")) await api("set",{path:"contacts/"+cid+"/events/draft",data:{type:"note",subject:"Draft, not sent: "+g("subj"),body:g("draft"),at:Date.now()}}); }catch(e){} } }
  await loadColl("contacts"); render(); toast(`${add} added, ${upd} updated`); }
function exportCsv(){ const K=["id","company","name","role","email","phone","website","city","state","zip","cls","status","leadSource","campaign","firstSent","last","created","source","notes"]; const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const csv=[K.join(","),...sortRows(filtered()).map(c=>K.map(k=>q(DATEK.has(k)&&c[k]?fmt(c[k]):k==="campaign"?campName(c[k]):c[k])).join(","))].join("\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"})); a.download="packed-rabbit-contacts.csv"; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000); }

/* ---------- start ---------- */
setInterval(()=>{ if(document.visibilityState==="visible"&&S.in&&!S.sel&&!S.editCamp&&!S.editProd&&!S.editProj&&!S.newTask&&!S.tEdit&&!S.compose&&!S.tOpen&&!(document.activeElement&&/TEXTAREA|INPUT|SELECT/.test(document.activeElement.tagName))) Promise.all(["tasks","mail"].map(loadColl)).then(()=>render()).catch(()=>{}); },60000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&S.in&&!S.sel&&!S.editCamp&&!S.editProd&&!S.editProj&&!S.newTask&&!S.tEdit&&!S.compose) loadAll().then(render).catch(()=>{}); });
(async()=>{ try{ await api("me"); await start(); }catch(e){ if(!(e instanceof SignedOut)) $("#main").innerHTML='<div class="card"><p>Couldn\'t reach the hub. Check your connection, then reload this page.</p></div>'; } })();
</script>
